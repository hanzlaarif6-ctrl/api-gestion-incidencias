# Perfil "oracle": misma aplicación, base de datos Oracle.
# Se activa con SPRING_PROFILES_ACTIVE=oracle (ver docker-compose.oracle.yml).
# El driver y el dialecto de Hibernate se detectan solos a partir de la URL.
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}

  flyway:
    # Migraciones con los tipos propios de Oracle
    locations: classpath:db/oracle
